<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Demo | Verificación de Stock en Tiempo Real</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <div class="container navbar-content" style="display: flex; justify-content: space-between; align-items: center;">
      <h1 class="logo">TechStore<span>.io</span></h1>
      <div class="auth-controls">
        <button id="btn-login-trigger" class="btn btn-primary">Iniciar Sesión</button>
        <button id="btn-logout" class="btn btn-secondary" style="display: none;">Cerrar Sesión</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- VISTA 1: Catálogo de Productos -->
    <div id="view-catalog">
      <section class="hero">
        <h2>Catálogo de Productos en Tiempo Real</h2>
        <button id="btn-nuevo" class="btn btn-primary" style="margin-top: 15px; display: none;">+ Agregar Producto</button>
      </section>

      <section id="products-grid" class="products-grid">
        <!-- Los componentes ProductCard se renderizan aquí dinámicamente -->
      </section>
    </div>

    <!-- VISTA 2: Vista Independiente de Formulario (Creación / Edición) -->
    <div id="view-form" style="display: none;">
      <div class="form-container">
        <button id="btn-back" type="button" class="btn btn-secondary" style="margin-bottom: 20px;">← Volver al catálogo</button>
        <h2 id="form-title">Nuevo Producto</h2>

        <form id="product-form" class="modal-form">
          <div class="form-group">
            <label for="prod-nombre">Nombre</label>
            <input type="text" id="prod-nombre" required />
          </div>
          <div class="form-group">
            <label for="prod-desc">Descripción</label>
            <textarea id="prod-desc" rows="3" required></textarea>
          </div>
          <div class="form-group">
            <label for="prod-precio">Precio (Q.)</label>
            <input type="number" id="prod-precio" step="0.01" min="0" required />
          </div>
          <div class="form-group">
            <label for="prod-stock">Stock</label>
            <input type="number" id="prod-stock" min="0" required />
          </div>
          <div class="form-group">
            <label for="prod-imagen">URL de Imagen</label>
            <input type="url" id="prod-imagen" placeholder="https://ejemplo.com/imagen.jpg" />
          </div>
          <div class="modal-actions" style="margin-top: 20px;">
            <button type="button" id="btn-cancel" class="btn btn-secondary">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar Producto</button>
          </div>
        </form>
      </div>
    </div>

    <!-- MODAL DE LOGIN PARA ADMINISTRADORES -->
    <div id="modal-login" class="modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000;">
      <div class="form-container" style="max-width: 380px; width: 90%; padding: 25px; border-radius: 8px; background: #fff;">
        <h2 style="margin-bottom: 15px; text-align: center;">Acceso Administrador</h2>
        <form id="form-login" class="modal-form">
          <div class="form-group">
            <label for="login-user">Usuario</label>
            <input type="text" id="login-user" required autocomplete="username" />
          </div>
          <div class="form-group">
            <label for="login-pass">Contraseña</label>
            <input type="password" id="login-pass" required autocomplete="current-password" />
          </div>
          <div class="modal-actions" style="margin-top: 20px; display: flex; justify-content: space-between;">
            <button type="button" id="btn-close-login" class="btn btn-secondary">Cancelar</button>
            <button type="submit" class="btn btn-primary">Entrar</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script type="module" src="js/frontend/app.js"></script>
</body>
</html>
